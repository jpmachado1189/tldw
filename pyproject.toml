[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-to-skill"
version = "0.1.0"
description = "Free, resumable YouTube evidence extraction for portable Agent Skills."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
extract = ["yt-dlp[default]>=2026.8.19", "youtube-transcript-api>=1.2.4,<2"]
visual = ["pillow>=10.1", "imageio-ffmpeg>=0.6,<1"]
test = ["pytest>=8", "ruff>=0.11", "pyyaml>=6"]

[project.scripts]
youtube-to-skill = "ytskill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ytskill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
